name: Correction de contenu
description: Une erreur, une explication confuse ou une commande mal évaluée dans un jeu.
labels: ["contenu"]
body:
  - type: input
    id: jeu
    attributes:
      label: Jeu et secteur
      description: Par exemple « DevOps, secteur KERNEL, terminal 3 ».
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui ne va pas
      description: Recopie le texte concerné et explique l'erreur ou ce qui est confus pour un débutant.
    validations:
      required: true
  - type: textarea
    id: proposition
    attributes:
      label: Ta proposition
      description: Comment tu le formulerais (facultatif).
